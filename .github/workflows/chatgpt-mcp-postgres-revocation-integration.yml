name: ChatGPT MCP — isolated PostgreSQL revocation
on:
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/**'
      - '.github/workflows/chatgpt-mcp-postgres-revocation-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: test-only-not-production
          POSTGRES_DB: token_revocation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d token_revocation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/chatgpt-mcp/initialized-host-probe/package-lock.json
      - name: Install pinned probe dependencies
        working-directory: integrations/chatgpt-mcp/initialized-host-probe
        run: npm ci --ignore-scripts
      - name: Install integration-only PostgreSQL driver
        working-directory: integrations/chatgpt-mcp/initialized-host-probe
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit pg@8.16.3
      - name: Verify revocation against disposable PostgreSQL
        working-directory: integrations/chatgpt-mcp/initialized-host-probe
        env:
          TEST_POSTGRES_URL: postgresql://integration:test-only-not-production@127.0.0.1:5432/token_revocation_test
        run: node --test postgres-real-integration.test.mjs
