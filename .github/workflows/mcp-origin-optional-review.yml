name: MCP Origin optional - isolated compatibility gate
on:
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/adapters/private-mcp-http-handler.mjs'
      - 'integrations/chatgpt-mcp/test/private-mcp-http-handler.test.mjs'
      - '.github/scripts/mcp-origin-lab4-rehearsal.mjs'
      - '.github/workflows/mcp-origin-optional-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated MCP Origin/mTLS/OAuth guard tests
        shell: bash
        run: |
          set -euo pipefail
          node --check integrations/chatgpt-mcp/adapters/private-mcp-http-handler.mjs
          node --check integrations/chatgpt-mcp/test/private-mcp-http-handler.test.mjs
          node --check .github/scripts/mcp-origin-lab4-rehearsal.mjs
          node --test integrations/chatgpt-mcp/test/private-mcp-http-handler.test.mjs
      - name: Package pinned lab.4 Origin-only review candidate
        shell: bash
        run: |
          set -euo pipefail
          # A review artifact only. Never run dsh install, change a profile, or publish a container.
          test "$(node -p "require('./integrations/chatgpt-mcp/package.json').version")" = "0.1.0-lab.4"
          out="$RUNNER_TEMP/mcp-origin-review"
          mkdir -p "$out"
          npm pack ./integrations/chatgpt-mcp --ignore-scripts --pack-destination "$out" --json > "$out/npm-pack.json"
          archive="$(find "$out" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          packed_blob="$(tar -xOzf "$archive" package/adapters/private-mcp-http-handler.mjs | git hash-object --stdin)"
          test "$packed_blob" = '1e98882f9d78a765a2b267425c298cfdcbce0393'
          # Tests, credentials, deploy scripts, and workflows do not belong in this plugin tarball.
          if tar -tzf "$archive" | grep -Eq '(^|/)(test|deploy|secrets|\.github)(/|$)'; then
            echo 'Unexpected files in MCP review tarball' >&2
            exit 1
          fi
          echo "MCP_LAB4_ORIGIN_PACKED_BLOB=$packed_blob"
          sha256sum "$archive"
      - name: Retain offline-review package (not deployment)
        uses: actions/upload-artifact@v4
        with:
          name: mcp-lab4-origin-review
          path: ${{ runner.temp }}/mcp-origin-review/*.tgz
          if-no-files-found: error
          retention-days: 7

  origin-lab4-offline:
    needs: origin-compat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download only the reviewed lab4 tarball
        uses: actions/download-artifact@v4
        with:
          name: mcp-lab4-origin-review
          path: ${{ runner.temp }}/mcp-origin-tarball
      - name: Exercise official DSH CLI in disposable profile and disconnected replacement
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/oaranha/deepharness-mcp@sha256:2483c85cc3fbe6172bf284e67859572b8b6b5dc75bfea11ae160298f7202a62f
          archive="$RUNNER_TEMP/mcp-origin-tarball/wandora-deepharness-chatgpt-mcp-read-0.1.0-lab.4.tgz"
          test -f "$archive"
          echo "73756d0bbe9f6fa90aafdcb00fb05b459e4e9db380c0e2d64ea78578b63f04d6  $archive" | sha256sum -c -
          docker pull "$image"
          fixture="$(mktemp -d "$RUNNER_TEMP/origin-same-version.XXXXXX")"
          chmod 0777 "$fixture"
          mkdir -p "$fixture/review"
          cp -- "$archive" "$fixture/review/hotfix.tgz"
          chmod 0755 "$fixture/review"
          chmod 0644 "$fixture/review/hotfix.tgz"
          # Preparation may download only public fixture dependencies; no production state.
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 1000:1000 --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=1g \
            --mount "type=bind,source=$fixture,target=/fixture" \
            --mount "type=bind,source=$PWD/.github/scripts,target=/review,readonly" \
            -e HOME=/fixture/home -e DSH_HOME=/fixture/home \
            -e DSH_MCP_ORIGIN_CI=isolated-fixture-only \
            --entrypoint node "$image" /review/mcp-origin-lab4-rehearsal.mjs prepare
          # The SAME-VERSION replacement has no network and uses only the copy.
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 1000:1000 --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=1g \
            --mount "type=bind,source=$fixture,target=/fixture" \
            --mount "type=bind,source=$PWD/.github/scripts,target=/review,readonly" \
            -e HOME=/fixture/home -e DSH_HOME=/fixture/home \
            -e DSH_MCP_ORIGIN_CI=isolated-fixture-only \
            --entrypoint node "$image" /review/mcp-origin-lab4-rehearsal.mjs verify
