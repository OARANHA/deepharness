name: Publish exact DeepHarness semantic backend (one-time)
on:
  push:
    branches:
      - release/semantic-backend-ddc94345-20261020
    paths:
      - .github/workflows/publish-reviewed-semantic-backend-ddc94345.yml
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-reviewed-semantic-backend-ddc94345
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'OARANHA/deepharness' &&
      github.ref == 'refs/heads/release/semantic-backend-ddc94345-20261020' &&
      github.event.head_commit.message == 'release(semantic-backend): publish approved Stage D 42 image without rebuilding or deploying'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed source, not the release workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ddc94345d552dbda4f76e8571cb74faf89126e8c
      - name: Check successful source gates and exact artifact ZIP checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ddc94345d552dbda4f76e8571cb74faf89126e8c
          test "$(git rev-parse HEAD^{tree})" = 66aed7aa01cfd0f8e01d605eef57d1ccf1d263c4
          for run in 39385201789 39385201799; do
            gh api "repos/OARANHA/deepharness/actions/runs/$run" > "$RUNNER_TEMP/gate-$run.json"
            python3 - "$RUNNER_TEMP/gate-$run.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["head_sha"]=="ddc94345d552dbda4f76e8571cb74faf89126e8c"
          assert d["event"]=="pull_request" and d["status"]=="completed" and d["conclusion"]=="success"
          assert d["repository"]["full_name"]=="OARANHA/deepharness"
          PY
          done
          gh api repos/OARANHA/deepharness/actions/artifacts/12247455831 > "$RUNNER_TEMP/artifact.json"
          python3 - "$RUNNER_TEMP/artifact.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["id"]==12247455831 and d["expired"] is False
          assert d["name"]=="stage-d-integrated-candidates-ddc94345d552dbda4f76e8571cb74faf89126e8c"
          assert d["digest"]=="sha256:637b77576ba36571cbd32240cc90fe3b2c500fe21274dcfe0ed46d6f182b3b74"
          assert d["workflow_run"]["id"]==39385201799
          assert d["workflow_run"]["head_sha"]=="ddc94345d552dbda4f76e8571cb74faf89126e8c"
          PY
          gh api repos/OARANHA/deepharness/actions/artifacts/12247455831/zip > "$RUNNER_TEMP/approved.zip"
          echo "637b77576ba36571cbd32240cc90fe3b2c500fe21274dcfe0ed46d6f182b3b74  $RUNNER_TEMP/approved.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/approved"
          unzip -q "$RUNNER_TEMP/approved.zip" -d "$RUNNER_TEMP/approved"
          python3 deploy/mcp/verify_semantic_backend_review.py "$RUNNER_TEMP/approved" \
            ddc94345d552dbda4f76e8571cb74faf89126e8c \
            66aed7aa01cfd0f8e01d605eef57d1ccf1d263c4
          echo SEMANTIC_PUBLISH_SOURCE=GREEN
      - name: Load EXACT saved candidate, no build
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/approved/candidate-images.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' local/stage-d-mcp:tested)" = sha256:0241bc069680c3c8141f4ea54f70bba4e175786723bf793a30297a6f5bd24ed0
          docker image inspect local/stage-d-mcp:tested | python3 -c '
          import json,sys
          d=json.load(sys.stdin)[0]; c=d["Config"]
          assert d["Os"]=="linux" and d["Architecture"]=="amd64"
          assert c["User"]=="node" and c.get("ExposedPorts") in ({},{"3080/tcp":{}},None)
          assert c.get("Labels",{}).get("org.opencontainers.image.revision")=="ddc94345d552dbda4f76e8571cb74faf89126e8c"
          assert "MCP_CANDIDATE_DISABLED" in " ".join(c.get("Cmd") or [])
          '
          echo SEMANTIC_PUBLISH_IMAGE=GREEN
      - name: Log into GHCR using short-lived GitHub Actions token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ONLY backend and verify GHCR config digest
        shell: bash
        run: |
          set -euo pipefail
          tag=ghcr.io/oaranha/deepharness-mcp:semantic-ddc94345d552dbda4f76e8571cb74faf89126e8c
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo SEMANTIC_PUBLISH=NO_GO_TAG_ALREADY_EXISTS
            exit 1
          fi
          docker tag local/stage-d-mcp:tested "$tag"
          docker push "$tag" > "$RUNNER_TEMP/push-output.txt"
          digest="$(python3 - "$RUNNER_TEMP/push-output.txt" <<'PY'
          import re,sys
          found=re.findall(r"digest:\s*(sha256:[a-f0-9]{64})",open(sys.argv[1]).read())
          assert len(found)==1
          print(found[0])
          PY
          )"
          docker buildx imagetools inspect --raw "$tag" > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["schemaVersion"]==2
          assert m["config"]["digest"]=="sha256:0241bc069680c3c8141f4ea54f70bba4e175786723bf793a30297a6f5bd24ed0"
          PY
          mkdir -p "$RUNNER_TEMP/semantic-release"
          echo "ghcr.io/oaranha/deepharness-mcp@$digest" > "$RUNNER_TEMP/semantic-release/backend-manifest.txt"
          echo "ddc94345d552dbda4f76e8571cb74faf89126e8c" > "$RUNNER_TEMP/semantic-release/source.txt"
          echo "12247455831" > "$RUNNER_TEMP/semantic-release/artifact-id.txt"
          echo SEMANTIC_PUBLISH=GREEN
          echo "GHCR reviewed backend: `ghcr.io/oaranha/deepharness-mcp@$digest`" >> "$GITHUB_STEP_SUMMARY"
          echo "From Stage D #42, artifact 12247455831; no rebuild, no VPS operation, no deploy" >> "$GITHUB_STEP_SUMMARY"
      - name: Save published immutable digest
        uses: actions/upload-artifact@v4
        with:
          name: semantic-backend-published-${{ github.run_id }}
          path: ${{ runner.temp }}/semantic-release/
          retention-days: 30
