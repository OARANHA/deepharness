name: ChatGPT MCP — Agent Teams read model

on:
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/adapters/dsh-host-read-binding.mjs'
      - 'integrations/chatgpt-mcp/test/dsh-host-read-binding.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/agent-teams-read-model.mjs'
      - 'integrations/chatgpt-mcp/test/agent-teams-read-model.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/agent-teams-read-authorization.mjs'
      - 'integrations/chatgpt-mcp/test/agent-teams-read-authorization.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/dsh-agent-teams-host-reader.mjs'
      - 'integrations/chatgpt-mcp/test/dsh-agent-teams-host-reader.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/scoped-mcp-read-identity.mjs'
      - 'integrations/chatgpt-mcp/test/scoped-mcp-read-identity.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/bearer-scoped-team-reader.mjs'
      - 'integrations/chatgpt-mcp/test/bearer-scoped-team-reader.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/scoped-read-grants.mjs'
      - 'integrations/chatgpt-mcp/test/scoped-read-grants.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/mcp-read-request-context.mjs'
      - 'integrations/chatgpt-mcp/test/mcp-read-request-context.test.mjs'
      - 'integrations/chatgpt-mcp/adapters/register-scoped-team-read-tool.mjs'
      - 'integrations/chatgpt-mcp/sdk-probe/**'
      - 'integrations/chatgpt-mcp/host-probe/**'
      - 'integrations/chatgpt-mcp/initialized-host-probe/**'
      - 'integrations/chatgpt-mcp/test/projection-fixture.mjs'
      - '.github/workflows/mcp-agent-teams-read-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only projection unit contract
        run: node --test integrations/chatgpt-mcp/test/agent-teams-read-model.test.mjs integrations/chatgpt-mcp/test/agent-teams-read-authorization.test.mjs integrations/chatgpt-mcp/test/dsh-agent-teams-host-reader.test.mjs integrations/chatgpt-mcp/test/scoped-mcp-read-identity.test.mjs integrations/chatgpt-mcp/test/bearer-scoped-team-reader.test.mjs integrations/chatgpt-mcp/test/scoped-read-grants.test.mjs integrations/chatgpt-mcp/test/mcp-read-request-context.test.mjs integrations/chatgpt-mcp/test/dsh-host-read-binding.test.mjs

  sdk-scoped-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated pinned MCP SDK probe
        run: npm ci --prefix integrations/chatgpt-mcp/sdk-probe --ignore-scripts --no-audit --no-fund
      - name: Stateful MCP HTTP scoped read and negative contract
        run: npm test --prefix integrations/chatgpt-mcp/sdk-probe

  host-lock-preflight:
    # Temporary isolated prerequisite, not the official initialized-host gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from committed lock without install scripts
        run: npm ci --prefix integrations/chatgpt-mcp/host-probe --ignore-scripts --no-audit --no-fund
      - name: Verify published official DSH package surfaces
        run: npm test --prefix integrations/chatgpt-mcp/host-probe

  initialized-host-dependency-gate:
    # Separate preflight; full TeamService + JSONL runtime is not yet proven.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from committed initialized-host lockfile
        run: npm ci --prefix integrations/chatgpt-mcp/initialized-host-probe --ignore-scripts --no-audit --no-fund
      - name: Verify initialized-host prerequisite contracts
        run: npm test --prefix integrations/chatgpt-mcp/initialized-host-probe
