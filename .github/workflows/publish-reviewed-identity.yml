name: Publish reviewed identity image
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_IDENTITY_38620831361 to publish the reviewed artifact"
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-reviewed-identity
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'OARANHA/deepharness' && inputs.confirmation == 'PUBLISH_IDENTITY_38620831361'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify reviewed run and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/OARANHA/deepharness/actions/runs/38620831361 > /tmp/identity-run.json
          python3 -c 'import json; d=json.load(open("/tmp/identity-run.json")); assert d["conclusion"]=="success"; assert d["head_sha"]=="3260eecc5121d08144f8ba55c72a4d3aa65349d4"; assert d["repository"]["full_name"]=="OARANHA/deepharness"'
          gh api repos/OARANHA/deepharness/actions/artifacts/11921337925 > /tmp/identity-artifact.json
          python3 -c 'import json; d=json.load(open("/tmp/identity-artifact.json")); assert not d["expired"]; assert d["name"]=="identity-tested-image-38620831361"; assert d["digest"]=="sha256:41440a3612e247cf5f5f754d874a2d67b4cf1a339e8c9f4ec5a45727590c344b"; assert d["workflow_run"]["id"]==38620831361'
          gh api repos/OARANHA/deepharness/actions/artifacts/11921337925/zip > /tmp/identity-artifact.zip
          echo '41440a3612e247cf5f5f754d874a2d67b4cf1a339e8c9f4ec5a45727590c344b  /tmp/identity-artifact.zip' | sha256sum --check
          mkdir /tmp/identity-reviewed
          unzip -q /tmp/identity-artifact.zip -d /tmp/identity-reviewed
          cd /tmp/identity-reviewed
          sha256sum --check SHA256SUMS
          test "$(cat source-head.txt)" = 3260eecc5121d08144f8ba55c72a4d3aa65349d4
          test "$(cat keycloak-image-id.txt)" = sha256:be75846e32294642d9e978b2c3a21129e2f9aeb0c1263613d673df438653386f
          gzip -dc keycloak-tested.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' local/wandora-keycloak:ci)" = "$(cat keycloak-image-id.txt)"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested image and record manifest digest
        shell: bash
        run: |
          set -euo pipefail
          tag=ghcr.io/oaranha/wandora-keycloak:tested-3260eecc5121d08144f8ba55c72a4d3aa65349d4
          docker tag local/wandora-keycloak:ci "$tag"
          docker push "$tag" > /tmp/identity-push.txt
          digest="$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\\1/p' /tmp/identity-push.txt | tail -n 1)"
          test -n "$digest"
          echo "Published exact tested image: ghcr.io/oaranha/wandora-keycloak@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Source artifact:11921337925; GREEN run:38620831361; no rebuild; no deploy" >> "$GITHUB_STEP_SUMMARY"
