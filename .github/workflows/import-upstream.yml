name: Import official DeepSeek Harness snapshot (once)
on:
  push:
    branches: [main]
    paths: [".bootstrap/IMPORT_REQUEST"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepharness-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'OARANHA/deepharness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned upstream source without running upstream code
        shell: bash
        env:
          UPSTREAM_SHA: d743267388641bc76f17c45ce8b4c231aed1d32c
        run: |
          set -euo pipefail
          test -f .bootstrap/IMPORT_REQUEST || { echo 'Already imported; nothing to do'; exit 0; }
          git clone --depth 1 --branch master https://github.com/deepseek-ai/deepseek-harness.git "$RUNNER_TEMP/dsh-upstream"
          git -C "$RUNNER_TEMP/dsh-upstream" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/dsh-upstream" checkout --detach "$UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/dsh-upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/workflows/' \
            --exclude='/deploy/' \
            --exclude='/docs/PROJECT_SOURCE.md' \
            --exclude='/docs/CANONICAL_STATE.md' \
            --exclude='/UPSTREAM.md' \
            --exclude='/README.md' \
            --exclude='/AGENTS.md' \
            --exclude='/.bootstrap/' \
            "$RUNNER_TEMP/dsh-upstream/" "$GITHUB_WORKSPACE/"
          test -f LICENSE
          test -f package.json
          rm .bootstrap/IMPORT_REQUEST
          rmdir .bootstrap
          git add -A
          git diff --cached --quiet && { echo 'No import changes'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "vendor: snapshot deepseek-ai/deepseek-harness at ${UPSTREAM_SHA}"
          git push origin HEAD:main
