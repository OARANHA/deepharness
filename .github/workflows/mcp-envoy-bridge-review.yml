name: MCP Envoy bridge review (isolated)
on:
  pull_request:
    paths:
      - deploy/portainer-stack.yml
      - deploy/mcp/envoy-public-bridge.review.yaml
      - deploy/mcp/prepare-proxy-client-cert.review.sh
      - deploy/mcp/STAGE_E_PUBLIC_ENVOY_BRIDGE_REVIEW_20261017.md
      - .github/workflows/mcp-envoy-bridge-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envoy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable TLS fixture (no production secrets)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/mcp-bridge-tls"
          mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=CI dummy CA' \
            -keyout "$d/ca.key" -out "$d/backend-ca.pem" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj '/CN=CI dummy client' \
            -keyout "$d/backend-client-key.pem" -out "$d/client.csr" >/dev/null 2>&1
          openssl x509 -req -days 1 -in "$d/client.csr" -CA "$d/backend-ca.pem" \
            -CAkey "$d/ca.key" -CAcreateserial -out "$d/backend-client-cert.pem" >/dev/null 2>&1
          chmod 0644 "$d/backend-client-cert.pem" "$d/backend-client-key.pem" "$d/backend-ca.pem"
      - name: Verify Envoy v3 bootstrap with no network or listeners
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            -v "$PWD/deploy/mcp/envoy-public-bridge.review.yaml:/etc/wandora-mcp/envoy.json:ro" \
            -v "$RUNNER_TEMP/mcp-bridge-tls:/run/secrets:ro" \
            --entrypoint envoy envoyproxy/envoy@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66 \
            --mode validate -c /etc/wandora-mcp/envoy.json --log-level error
      - name: Prove guarded mTLS client certificate issuance with synthetic CA (no production secrets)
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/mcp/prepare-proxy-client-cert.review.sh
          dir='/opt/wandora/data/deepharness-mcp/tls'
          sudo mkdir -p "$dir/backend"
          openssl req -x509 -newkey rsa:2048 -nodes -days 45 \
            -subj '/CN=CI stage E dummy CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$RUNNER_TEMP/mcp-test-ca.key" \
            -out "$RUNNER_TEMP/mcp-test-ca.crt" >/dev/null 2>&1
          sudo install -m 0644 "$RUNNER_TEMP/mcp-test-ca.crt" "$dir/backend/backend-ca.pem"
          readonly helper='deploy/mcp/prepare-proxy-client-cert.review.sh'
          sudo bash "$helper" --check | grep -qx 'MCP_PROXY_CLIENT_CERT_PRESENT_VALID=false' || exit 1
          if sudo env MCP_PROXY_CI_FIXTURE=ephemeral-github-runner-only \
            MCP_PROXY_CA_SIGNING_KEY="$RUNNER_TEMP/mcp-test-ca.key" \
            bash "$helper" --issue >/dev/null 2>&1; then
            echo 'MCP_UNAUTHORIZED_CERT_ISSUE_NOT_DENIED'; exit 1
          fi
          sudo env MCP_PROXY_CI_FIXTURE=ephemeral-github-runner-only \
            MCP_PROXY_CA_SIGNING_KEY="$RUNNER_TEMP/mcp-test-ca.key" \
            MCP_PROXY_CERT_ISSUE_ACK=APPROVE_NEW_PROXY_CLIENT_CERT_ONLY \
            bash "$helper" --issue | grep -qx 'MCP_PROXY_CLIENT_MTLS_CERT_ISSUED_AND_VERIFIED'
          sudo bash "$helper" --check | grep -qx 'MCP_PROXY_CLIENT_CERT_PRESENT_VALID=true'
          if sudo env MCP_PROXY_CI_FIXTURE=ephemeral-github-runner-only \
            MCP_PROXY_CA_SIGNING_KEY="$RUNNER_TEMP/mcp-test-ca.key" \
            MCP_PROXY_CERT_ISSUE_ACK=APPROVE_NEW_PROXY_CLIENT_CERT_ONLY \
            bash "$helper" --issue >/dev/null 2>&1; then
            echo 'MCP_REISSUE_OVERWRITE_NOT_DENIED'; exit 1
          fi
          # Validate the actual operator bind layout, UID 1000 key access and full Envoy v3 parse.
          docker run --rm --network none --read-only --cap-drop ALL --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            -v "$PWD/deploy/mcp/envoy-public-bridge.review.yaml:/etc/wandora-mcp/envoy.json:ro" \
            -v "$dir/proxy-client-cert.pem:/run/secrets/backend-client-cert.pem:ro" \
            -v "$dir/proxy-client-key.pem:/run/secrets/backend-client-key.pem:ro" \
            -v "$dir/backend/backend-ca.pem:/run/secrets/backend-ca.pem:ro" \
            --entrypoint envoy envoyproxy/envoy@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66 \
            --mode validate -c /etc/wandora-mcp/envoy.json --log-level error
          echo 'MCP_CERT_ISSUER_GUARDS_AND_NONROOT_ENVOY_MOUNTS_GREEN'
      - name: Compose syntax and defense-in-depth guards
        shell: bash
        run: |
          set -euo pipefail
          export DSH_MCP_HOST_IMAGE='local/mcp-host:review'
          export DSH_MCP_GRANTS_IMAGE='local/mcp-grants:review'
          export DSH_MCP_PROXY_IMAGE='local/envoy:review'
          export DSH_MCP_REVIEW_ROOT='/tmp/mcp-review'
          export DSH_MCP_SECRET_ROOT='/tmp/mcp-secret'
          export DSH_BASIC_AUTH_USERS='review-placeholder'
          docker compose -f deploy/portainer-stack.yml config --quiet
          python3 - <<'PY'
          from pathlib import Path
          stack = Path('deploy/portainer-stack.yml').read_text()
          envoy = Path('deploy/mcp/envoy-public-bridge.review.yaml').read_text()
          assert 'traefik.http.routers.deepharness-mcp.tls.certresolver: letsencrypt' in stack
          assert 'traefik.http.services.deepharness-mcp-bridge.loadbalancer.server.port: \'8080\'' in stack
          assert "traefik.enable: 'true'" in stack
          assert 'traefik.tcp.routers.deepharness-mcp.' not in stack
          assert 'traefik.http.routers.deepharness.rule=Host(`deep.wandora.com.br`)' in stack
          assert 'deepharness_dsh_data' in stack and 'deepharness_dsh_workspace' in stack
          assert '3443' in envoy and 'mcp_private_mtls' in envoy
          assert '/run/secrets/backend-client-key.pem' in envoy
          assert 'match_typed_subject_alt_names:' in envoy
          assert 'dsh-mcp.wandora.com.br' in envoy
          assert 'path: /mcp' in envoy
          assert 'path: /.well-known/oauth-protected-resource/mcp' in envoy
          assert 'proxy-client-key.pem' in stack
          assert 'docker.sock' not in stack
          assert 'ports:' not in stack.split('  mcp-proxy:\n',1)[1].split('  mcp-grants-db:\n',1)[0]
          print('MCP_ENVOY_REVIEW_STATIC_GUARDS_PASS')
          PY
