name: CI — DeepHarness bootstrap image
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: deepharness-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: github.repository == 'OARANHA/deepharness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avoid release before upstream import
        id: state
        shell: bash
        run: |
          if test -f .bootstrap/IMPORT_REQUEST || ! test -f LICENSE || ! test -f package.json; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build pinned image in CI (never on 28server)
        if: steps.state.outputs.ready == 'true'
        run: docker build --pull -f deploy/Dockerfile -t local/deepharness:ci .
      - name: Native addon probe under container runtime restrictions
        if: steps.state.outputs.ready == 'true'
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --tmpfs /data/dsh:rw,nosuid,nodev,size=128m \
            --tmpfs /workspace:rw,nosuid,nodev,size=128m \
            local/deepharness:ci \
            node -e "const a=require('/opt/dsh/node_modules/node-addon-require-builtin'); console.log(a.getBindingInfo().backend)"
      - name: Web UI startup smoke (no launch tokens in CI logs)
        if: steps.state.outputs.ready == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          name="deepharness-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            local rc="$?"
            if [[ "$rc" -ne 0 ]]; then
              echo "::group::Sanitized DSH startup diagnostics"
              docker inspect --format='container_status={{.State.Status}} exit_code={{.State.ExitCode}}' "$name" 2>/dev/null || true
              docker logs --tail 140 "$name" 2>&1 | python3 -c 'import re,sys; [print("[redacted potentially sensitive log line]" if re.search(r"(?i)(?:https?://|token|passphrase|password|secret|api[_-]?key|authorization|bearer|cookie)", line) else line.rstrip()) for line in sys.stdin]' || true
              echo "::endgroup::"
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" --init --read-only --network none \
            --security-opt no-new-privileges --cap-drop ALL \
            --pids-limit 256 --memory 2g --cpus 1.5 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --tmpfs /data/dsh:rw,nosuid,nodev,size=256m,mode=0700,uid=1000,gid=1000 \
            --tmpfs /workspace:rw,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000 \
            local/deepharness:ci >/dev/null
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$name")" = none || {
            echo "::error::Preview container must have no external network"; exit 1;
          }
          ready=0
          response=000
          for _ in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$name")"
            if [[ "$state" != running ]]; then
              echo "::error::DSH exited during startup (state=$state)"
              docker inspect --format 'exit_code={{.State.ExitCode}}' "$name"
              exit 1
            fi
            response="$(docker exec "$name" curl -sS --max-time 2 --output /dev/null --write-out '%{http_code}' \
              --header 'Host: 127.0.0.1:3080' "http://127.0.0.1:3080/index.html" 2>/dev/null || true)"
            if [[ "$response" == 401 ]]; then
              trusted_api="$(docker exec "$name" curl -sS --max-time 2 --output /dev/null --write-out '%{http_code}' \
                --header 'Host: 127.0.0.1:3080' "http://127.0.0.1:3080/api/" 2>/dev/null || true)"
              if [[ "$trusted_api" != 401 ]]; then
                echo "::error::Trusted Host API unauthenticated response must be 401 (HTTP $trusted_api)"
                exit 1
              fi
              rejected="$(docker exec "$name" curl -sS --max-time 2 --output /dev/null --write-out '%{http_code}' \
                --header 'Host: untrusted.example.invalid' "http://127.0.0.1:3080/api/" 2>/dev/null || true)"
              if [[ "$rejected" != 403 ]]; then
                echo "::error::Untrusted Host check failed (HTTP $rejected)"
                exit 1
              fi
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Web did not return expected HTTP 401 after startup (last HTTP $response)"
            exit 1
          fi
          sleep 3
          test "$(docker inspect --format '{{.State.Status}}' "$name")" = running
          echo "Isolated alpha startup OK: index 401, trusted API 401, untrusted API 403, no network, alive"
      - name: Docker bridge-only ingress canary (no host port)
        if: steps.state.outputs.ready == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          net="deepharness-ci-net-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          name="deepharness-ci-bridge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            rc="$?"
            if [[ "$rc" -ne 0 ]]; then
              echo "::group::Sanitized bridge canary diagnostics"
              docker inspect --format='container_status={{.State.Status}} exit_code={{.State.ExitCode}}' "$name" 2>/dev/null || true
              docker logs --tail 140 "$name" 2>&1 | python3 -c 'import re,sys; [print("[redacted potentially sensitive log line]" if re.search(r"(?i)(?:https?://|token|passphrase|password|secret|api[_-]?key|authorization|bearer|cookie)", line) else line.rstrip()) for line in sys.stdin]' || true
              echo "::endgroup::"
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal --driver bridge "$net" >/dev/null
          test "$(docker network inspect --format '{{.Internal}}' "$net")" = true
          # This is the official concrete-interface mode, tested only on an internal CI network.
          # No host port, external router, exposed socket or production stack is created.
          docker run -d --name "$name" --network "$net" --network-alias app \
            --init --read-only --security-opt no-new-privileges --cap-drop ALL \
            --pids-limit 256 --memory 2g --cpus 1.5 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --tmpfs /data/dsh:rw,nosuid,nodev,size=256m,mode=0700,uid=1000,gid=1000 \
            --tmpfs /workspace:rw,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000 \
            local/deepharness:ci \
            sh -ec 'set -- $(hostname -i); test -n "$1"; exec dsh web --no-open --port 3080 --host "$1" --public-url https://deep.wandora.com.br/ --trusted-host deep.wandora.com.br' >/dev/null
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$name")" = 0
          ready=0
          for _ in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$name")"
            if [[ "$state" != running ]]; then
              echo "::error::Bridge canary exited during startup ($state)"
              exit 1
            fi
            response="$(docker run --rm --network "$net" local/deepharness:ci \
              curl -sS --max-time 2 -o /dev/null -w '%{http_code}' \
              -H 'Host: deep.wandora.com.br' http://app:3080/api/ 2>/dev/null || true)"
            if [[ "$response" == 401 ]]; then
              rejected="$(docker run --rm --network "$net" local/deepharness:ci \
                curl -sS --max-time 2 -o /dev/null -w '%{http_code}' \
                -H 'Host: untrusted.example.invalid' http://app:3080/api/ 2>/dev/null || true)"
              if [[ "$rejected" != 403 ]]; then
                echo "::error::Bridge Host fence must return 403 (HTTP $rejected)"
                exit 1
              fi
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Trusted Host API on bridge did not return 401 (last HTTP $response)"
            exit 1
          fi
          sleep 3
          test "$(docker inspect --format '{{.State.Status}}' "$name")" = running
          echo "Bridge-only canary OK: isolated Docker network, no published ports, API 401/403"

      - name: Validate Portainer stack syntax and shared-network wiring
        if: steps.state.outputs.ready == 'true'
        env:
          DEEPHARNESS_IMAGE: ghcr.io/oaranha/deepharness@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DSH_BASIC_AUTH_USERS: ci-placeholder-no-secret
          DSH_MCP_HOST_IMAGE: ghcr.io/oaranha/deepharness-mcp@sha256:2483c85cc3fbe6172bf284e67859572b8b6b5dc75bfea11ae160298f7202a62f
          DSH_MCP_GRANTS_IMAGE: ghcr.io/oaranha/deepharness-grants@sha256:6279a36d7cd94b7309e38b2931de38dd4f07bb84a5440e1b6433203587725210
          DSH_MCP_PROXY_IMAGE: envoyproxy/envoy@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
          DSH_MCP_REVIEW_ROOT: /opt/wandora/data/deepharness-mcp/review
          DSH_MCP_SECRET_ROOT: /opt/wandora/data/deepharness-mcp/tls
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/portainer-stack.yml config --quiet
          docker compose -f deploy/portainer-stack.yml config --format json | python3 -c '
          import json, os, sys
          doc=json.load(sys.stdin)
          services=doc["services"]
          assert not any(s.get("ports") for s in services.values()), "No service may publish ports"
          assert doc["networks"]["traefik-public"]["external"] is True
          web=services["web"]
          labels=web["labels"]
          assert labels["traefik.http.routers.deepharness.middlewares"]=="deepharness-auth"
          assert labels["traefik.http.middlewares.deepharness-auth.basicauth.users"]==os.environ["DSH_BASIC_AUTH_USERS"]
          assert labels["traefik.http.services.deepharness.loadbalancer.server.port"]=="3080"
          if set(services)=={"web"}:
              assert set(web["networks"])=={"traefik-public"}
              cmd=web["command"]
              assert len(cmd)==3 and cmd[:2]==["sh","-ec"]
              assert "hostname -i" in cmd[2]
              assert "--public-url https://deep.wandora.com.br/" in cmd[2]
              assert "--trusted-host deep.wandora.com.br" in cmd[2]
              assert web["image"]==os.environ["DEEPHARNESS_IMAGE"]
              print("ORIGINAL_WEB_COMPOSE_SAFE")
          else:
              assert set(services) in ({"web","mcp-grants-db"}, {"web","mcp-grants-db","mcp-proxy"}), "Unexpected enabled services"
              db=services["mcp-grants-db"]
              assert web["image"]==os.environ["DSH_MCP_HOST_IMAGE"]
              assert db["image"]==os.environ["DSH_MCP_GRANTS_IMAGE"]
              assert str(web.get("user"))=="1000:1000"
              assert str(db.get("user"))=="999:999"
              assert web["command"]==["node","/opt/wandora-mcp-verifier/mcp/run-operational.mjs"]
              assert set(web["networks"])=={"mcp-private","traefik-public"}
              assert set(db["networks"])=={"mcp-private"}
              assert doc["networks"]["mcp-private"]["internal"] is True
              assert web["depends_on"]["mcp-grants-db"]["condition"]=="service_healthy"
              assert doc["volumes"]["dsh_data"]["external"] is True
              assert doc["volumes"]["dsh_data"]["name"]=="deepharness_dsh_data"
              assert doc["volumes"]["dsh_workspace"]["external"] is True
              assert doc["volumes"]["dsh_workspace"]["name"]=="deepharness_dsh_workspace"
              assert {"mcp-admin-db-password","mcp-runtime-db-password"}<=set(doc["secrets"])
              binds={v["target"]:v for v in web["volumes"]}
              for target in ["/etc/wandora-mcp/runtime.json","/run/secrets/backend-server-key.pem","/run/secrets/backend-server-chain.pem","/run/secrets/backend-ca.pem"]:
                  assert target in binds and binds[target]["read_only"] is True
              assert binds["/etc/wandora-mcp/runtime.json"]["source"]==os.environ["DSH_MCP_REVIEW_ROOT"]+"/runtime.json"
              if "mcp-proxy" in services:
                  # Stage E opt-in: don't weaken the original Stage C Web/DB fences.
                  proxy=services["mcp-proxy"]
                  assert proxy["image"]==os.environ["DSH_MCP_PROXY_IMAGE"]
                  assert str(proxy.get("user"))=="1000:1000"
                  assert proxy.get("read_only") is True
                  assert "ALL" in proxy.get("cap_drop",[])
                  assert "no-new-privileges:true" in proxy.get("security_opt",[])
                  assert set(proxy["networks"])=={"traefik-public","mcp-private"}
                  assert not proxy.get("ports") and not proxy.get("profiles")
                  assert proxy["command"]==["envoy","-c","/etc/wandora-mcp/envoy.json",
                      "--concurrency","1","--disable-hot-restart","--log-level","error"]
                  p=proxy["labels"]
                  assert p.get("traefik.enable")=="true"
                  assert p.get("traefik.docker.network")=="traefik-public"
                  assert p.get("traefik.http.routers.deepharness-mcp.rule")=="Host(\`dsh-mcp.wandora.com.br\`)"
                  assert p.get("traefik.http.routers.deepharness-mcp.entrypoints")=="websecure"
                  assert p.get("traefik.http.routers.deepharness-mcp.tls")=="true"
                  assert p.get("traefik.http.routers.deepharness-mcp.tls.certresolver")=="letsencrypt"
                  assert p.get("traefik.http.routers.deepharness-mcp.service")=="deepharness-mcp-bridge"
                  assert p.get("traefik.http.services.deepharness-mcp-bridge.loadbalancer.server.port")=="8080"
                  assert not any(k.startswith("traefik.tcp.") for k in p)
                  mounts={v["target"]:v for v in proxy["volumes"]}
                  expected={
                      "/etc/wandora-mcp/envoy.json": os.environ["DSH_MCP_REVIEW_ROOT"]+"/envoy.json",
                      "/run/secrets/backend-client-cert.pem": os.environ["DSH_MCP_SECRET_ROOT"]+"/proxy-client-cert.pem",
                      "/run/secrets/backend-client-key.pem": os.environ["DSH_MCP_SECRET_ROOT"]+"/proxy-client-key.pem",
                      "/run/secrets/backend-ca.pem": "/opt/wandora/data/deepharness-mcp/tls/backend/backend-ca.pem",
                  }
                  for target, source in expected.items():
                      assert mounts[target]["source"]==source
                      assert mounts[target]["read_only"] is True
                  assert set(mounts)==set(expected)
                  print("STAGE_E_MCP_PROXY_COMPOSE_REVIEW_SAFE")
              else:
                  print("STAGE_C_PRIVATE_COMPOSE_SAFE")
          '

      - name: Log in to GHCR
        if: steps.state.outputs.ready == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact commit image to GHCR
        if: steps.state.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/oaranha/deepharness:sha-${GITHUB_SHA}"
          docker tag local/deepharness:ci "$image"
          push_tail="$(docker push "$image" | tail -n 1)"
          digest="$(printf '%s\n' "$push_tail" | sed -nE 's/.*digest: (sha256:[[:xdigit:]]{64}).*/\1/p')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::GHCR push returned no validated manifest digest"
            exit 1
          fi
          echo "Published image: ghcr.io/oaranha/deepharness@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified GHCR manifest digest: $digest"
