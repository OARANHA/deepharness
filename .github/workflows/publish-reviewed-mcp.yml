name: Publish reviewed MCP images
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_STAGE_D_39004711244 (exact tested images; no deploy)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-reviewed-stage-d-39004711244
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'OARANHA/deepharness' && github.ref == 'refs/heads/feat/stage-d-operational-host-bind-20261017' && inputs.confirmation == 'PUBLISH_STAGE_D_39004711244'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify reviewed runs, source and immutable saved artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage-d-publication"
          cd "$RUNNER_TEMP/stage-d-publication"
          for run in 39004711244 39004711250; do
            gh api "repos/OARANHA/deepharness/actions/runs/$run" > "run-$run.json"
          done
          gh api repos/OARANHA/deepharness/actions/artifacts/12090193878 > artifact.json
          gh api repos/OARANHA/deepharness/commits/f5a5a4f75b680fa1866d843014ea61e7a5e40506 > source.json
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-reviewed-stage-d.py" metadata "$PWD"
          gh api repos/OARANHA/deepharness/actions/artifacts/12090193878/zip > artifact.zip
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-reviewed-stage-d.py" archive "$PWD"
          gzip -dc verified/candidate-images.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' local/stage-d-mcp:tested)" = sha256:cec5b1aaa1948170c2bc731815dda1db20b18f1b66096717a5ccb4e54ad3de51
          test "$(docker image inspect --format '{{.Id}}' local/stage-d-grants:tested)" = sha256:55eb4164bb47c8aff900156d3540b85e40d18da71b8fede1e8301a52bc7b6041
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the two loaded images without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stage-d-publication/digests"
          mkdir "$out"
          for pair in 'stage-d-mcp:tested deepharness-mcp' 'stage-d-grants:tested deepharness-grants'; do
            read -r image package <<< "$pair"
            tag="ghcr.io/oaranha/$package:tested-f5a5a4f75b680fa1866d843014ea61e7a5e40506"
            docker tag "local/$image" "$tag"
            docker push "$tag" > "$RUNNER_TEMP/stage-d-push.log"
            digest="$(python3 -c 'import re,sys; d=re.findall(r"digest: (sha256:[a-f0-9]{64})",open(sys.argv[1]).read()); assert len(d)==1; print(d[0])' "$RUNNER_TEMP/stage-d-push.log")"
            printf '%s\n' "ghcr.io/oaranha/$package@$digest" > "$out/$package.txt"
            printf 'Published exact reviewed image: `%s`\n' "ghcr.io/oaranha/$package@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '%s\n' 'Source:f5a5a4f75b680fa1866d843014ea61e7a5e40506; artifact:12090193878; no rebuild; no deploy; no VPS access' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-d-published-digests-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-d-publication/digests/
          retention-days: 30
