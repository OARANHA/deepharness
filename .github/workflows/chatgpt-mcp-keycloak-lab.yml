name: ChatGPT MCP — isolated Keycloak profile probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/chatgpt-mcp/runtime.mjs'
      - 'integrations/chatgpt-mcp/policy.mjs'
      - 'integrations/chatgpt-mcp/plugin.mjs'
      - '.github/workflows/chatgpt-mcp-keycloak-lab.yml'
      - 'integrations/chatgpt-mcp/keycloak-lab/**'
      - 'integrations/chatgpt-mcp/adapters/**'
      - 'integrations/chatgpt-mcp/sql/**'
      - 'integrations/chatgpt-mcp/initialized-host-probe/**'
permissions:
  contents: read
jobs:
  keycloak-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official DSH host probe dependencies
        run: npm ci --prefix integrations/chatgpt-mcp/initialized-host-probe --ignore-scripts --no-audit --no-fund
      - name: Install exact integration-only PostgreSQL driver
        working-directory: integrations/chatgpt-mcp/initialized-host-probe
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Start disposable primary revocation database
        shell: bash
        run: |
          set -euo pipefail
          LAB_PG_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$LAB_PG_PASSWORD"
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "PGPORT=15432" >> "$GITHUB_ENV"
          echo "PGUSER=integration" >> "$GITHUB_ENV"
          echo "PGDATABASE=token_revocation_test" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$LAB_PG_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name keycloak-mcp-postgres \
            -p 127.0.0.1:15432:5432 \
            -e POSTGRES_USER=integration \
            -e POSTGRES_DB=token_revocation_test \
            -e POSTGRES_PASSWORD="$LAB_PG_PASSWORD" postgres:16
          for i in {1..40}; do
            if docker exec keycloak-mcp-postgres pg_isready -U integration -d token_revocation_test >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Disposable revocation database readiness failed" >&2
          exit 1
      - name: Start throwaway Keycloak on loopback only
        shell: bash
        run: |
          set -euo pipefail
          LAB_CLIENT_SECRET="$(openssl rand -hex 32)"
          LAB_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          LAB_HUMAN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$LAB_CLIENT_SECRET"
          echo "::add-mask::$LAB_ADMIN_PASSWORD"
          echo "::add-mask::$LAB_HUMAN_PASSWORD"
          echo "KEYCLOAK_LAB_CLIENT_SECRET=$LAB_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "KEYCLOAK_LAB_HUMAN_PASSWORD=$LAB_HUMAN_PASSWORD" >> "$GITHUB_ENV"
          export LAB_CLIENT_SECRET LAB_HUMAN_PASSWORD
          node -e 'const fs=require("node:fs"); const t=fs.readFileSync(process.argv[1],"utf8"); fs.writeFileSync(process.argv[2],t.replace("__CI_GENERATED_CLIENT_SECRET__",process.env.LAB_CLIENT_SECRET).replace("__CI_GENERATED_HUMAN_PASSWORD__",process.env.LAB_HUMAN_PASSWORD))' "$PWD/integrations/chatgpt-mcp/keycloak-lab/realm.json" "$RUNNER_TEMP/keycloak-realm.json"
          # Ephemeral CA and server certificate. Private material stays in runner temp.
          umask 077
          mkdir -p "$RUNNER_TEMP/keycloak-lab-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/keycloak-lab-tls/ca.key" \
            -out "$RUNNER_TEMP/keycloak-lab-tls/ca.crt" \
            -subj "/CN=DSH isolated CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/keycloak-lab-tls/server.key" \
            -out "$RUNNER_TEMP/keycloak-lab-tls/server.csr" \
            -subj "/CN=127.0.0.1" >/dev/null 2>&1
          printf '%s\n' "subjectAltName=IP:127.0.0.1" "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" "extendedKeyUsage=serverAuth" \
            > "$RUNNER_TEMP/keycloak-lab-tls/server.ext"
          openssl x509 -req -days 1 -in "$RUNNER_TEMP/keycloak-lab-tls/server.csr" \
            -CA "$RUNNER_TEMP/keycloak-lab-tls/ca.crt" -CAkey "$RUNNER_TEMP/keycloak-lab-tls/ca.key" \
            -CAcreateserial -extfile "$RUNNER_TEMP/keycloak-lab-tls/server.ext" \
            -out "$RUNNER_TEMP/keycloak-lab-tls/server.crt" >/dev/null 2>&1
          chmod 644 "$RUNNER_TEMP/keycloak-lab-tls/ca.crt" "$RUNNER_TEMP/keycloak-lab-tls/server.crt"
          sudo chown 1000:1000 "$RUNNER_TEMP/keycloak-lab-tls/server.key"
          docker run -d --name keycloak-mcp-lab \
            --network bridge -p 127.0.0.1:18080:8443 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=lab-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$LAB_ADMIN_PASSWORD" \
            -v "$RUNNER_TEMP/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            -v "$RUNNER_TEMP/keycloak-lab-tls/server.crt:/opt/keycloak/conf/lab-server.crt:ro" \
            -v "$RUNNER_TEMP/keycloak-lab-tls/server.key:/opt/keycloak/conf/lab-server.key:ro" \
            quay.io/keycloak/keycloak:26.8.0 \
            start-dev --features=resource-indicators --import-realm --http-enabled=false \
            --https-port=8443 --https-certificate-file=/opt/keycloak/conf/lab-server.crt \
            --https-certificate-key-file=/opt/keycloak/conf/lab-server.key \
            --hostname=https://127.0.0.1:18080
          for i in {1..100}; do
            if curl -fsS --cacert "$RUNNER_TEMP/keycloak-lab-tls/ca.crt" --max-time 2 https://127.0.0.1:18080/realms/deepharness-mcp-lab/.well-known/openid-configuration >/dev/null; then exit 0; fi
            sleep 3
          done
          echo "Keycloak lab did not become ready; sanitized startup diagnostics:" >&2
          docker inspect --format "state={{.State.Status}} exit={{.State.ExitCode}}" keycloak-mcp-lab || true
          docker logs --tail 65 keycloak-mcp-lab 2>&1 | sed -E "s/(password|secret|token)([=: ]+)[^[:space:]]+/\\1\\2[REDACTED]/Ig" || true
          exit 1
      - name: Verify trusted TLS and rejection without lab CA
        env:
          KEYCLOAK_LAB_URL: https://127.0.0.1:18080
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/keycloak-lab-tls/ca.crt
        run: |
          node integrations/chatgpt-mcp/keycloak-lab/tls-probe.mjs
          env -u NODE_EXTRA_CA_CERTS KEYCLOAK_TLS_NEGATIVE=true node integrations/chatgpt-mcp/keycloak-lab/tls-probe.mjs
      - name: Probe actual JWT profile without printing tokens
        env:
          KEYCLOAK_LAB_URL: https://127.0.0.1:18080
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/keycloak-lab-tls/ca.crt
          KEYCLOAK_LAB_CLIENT_SECRET: ${{ env.KEYCLOAK_LAB_CLIENT_SECRET }}
        run: node integrations/chatgpt-mcp/keycloak-lab/probe.mjs
      - name: Test human authorization code PKCE on loopback
        env:
          KEYCLOAK_LAB_URL: https://127.0.0.1:18080
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/keycloak-lab-tls/ca.crt
          KEYCLOAK_LAB_HUMAN_PASSWORD: ${{ env.KEYCLOAK_LAB_HUMAN_PASSWORD }}
        run: node integrations/chatgpt-mcp/keycloak-lab/human-pkce-probe.mjs
      - name: Tear down ephemeral service
        if: always()
        run: |
          docker rm -f keycloak-mcp-lab || true
          docker rm -fv keycloak-mcp-postgres || true
          rm -rf "$RUNNER_TEMP/keycloak-lab-tls"
          rm -f "$RUNNER_TEMP/keycloak-realm.json"
