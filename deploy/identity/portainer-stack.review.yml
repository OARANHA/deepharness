# REVIEW ONLY — deploy to wandora-vps-01 after explicit authorization.
# Supply tested immutable image digests and secrets privately in Portainer.
services:
  keycloak:
    image: ${WANDORA_KEYCLOAK_IMAGE:?Provide tested optimized Keycloak digest}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_DB_PASSWORD="$(cat /run/secrets/identity-db-password)"
        if test -s /run/secrets/identity-bootstrap-password; then
          export KC_BOOTSTRAP_ADMIN_PASSWORD="$(cat /run/secrets/identity-bootstrap-password)"
        fi
        exec /opt/keycloak/bin/kc.sh start --optimized
    secrets:
      - identity-db-password
      - identity-bootstrap-password
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://id.wandora.com.br
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${WANDORA_ID_TRUSTED_PROXY:?Verified Traefik address only}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_CACHE: local
    depends_on:
      identity-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      identity-private:
      wandora-edge:
        aliases: ["wandora-identity-keycloak"]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  identity-db:
    image: ${WANDORA_ID_POSTGRES_IMAGE:?Provide tested PostgreSQL 16 digest}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/identity-db-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets: ["identity-db-password"]
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    networks: ["identity-private"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

volumes:
  identity_pgdata:

networks:
  identity-private:
    internal: true
  wandora-edge:
    external: true

secrets:
  identity-db-password:
    file: /opt/wandora/data/identity/secrets/db-password
  identity-bootstrap-password:
    file: /opt/wandora/data/identity/secrets/bootstrap-password
